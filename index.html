<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RazSlither.io - Bot Edition 🐍🤖</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: #09090b; 
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior-y: contain; 
            touch-action: none; 
        }
        
        .ui-layer {
            position: absolute;
            top: 15px; left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }
        h2 { margin: 0; color: #ff7675; font-size: 1.4rem; text-shadow: 0 2px 8px rgba(255, 118, 117, 0.4); }
        .score-board { font-size: 1.1rem; color: #ffeaa7; font-weight: bold; }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div class="ui-layer">
        <h2>RazSlither.io (تحدي البوتات 🤖)</h2>
        <div class="score-board">النقاط: <span id="score">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const WORLD_RADIUS = 1500; 
    const baseRadius = 9;          
    let currentRadius = baseRadius; 
    const speed = 3;             
    let score = 0;
    let isGameOver = false;

    // تعبان اللاعب الأصلي
    let snakeX = 0;
    let snakeY = 0;
    let snakeAngle = 0; 
    let pulseTime = 0;

    let snake = [];
    for (let i = 0; i < 40; i++) {
        snake.push({ x: -i * 2, y: 0 });
    }

    // التفاح والأكل
    let foods = [];
    for(let i=0; i<250; i++) { spawnFood(); }

    function spawnFood() {
        let ang = Math.random() * Math.PI * 2;
        let r = Math.random() * (WORLD_RADIUS - 50);
        foods.push({
            x: Math.cos(ang) * r,
            y: Math.sin(ang) * r,
            color: Math.random() > 0.5 ? "#ff3838" : "#ffb8b8" 
        });
    }

    // 🤖 مصفوفة التعابين الآلية (Bots)
    let bots = [];
    const botColors = ["#00cec9", "#6c5ce7", "#00b894"]; // ألوان البوتات (أزرق، بنفسجي، أخضر)
    
    for (let i = 0; i < 3; i++) {
        spawnBot(i);
    }

    function spawnBot(index) {
        let ang = Math.random() * Math.PI * 2;
        let r = Math.random() * (WORLD_RADIUS - 200);
        let bx = Math.cos(ang) * r;
        let by = Math.sin(ang) * r;
        let bAngle = Math.random() * Math.PI * 2;
        
        let bBody = [];
        for (let j = 0; j < 35; j++) {
            bBody.push({ x: bx - j * 2, y: by });
        }
        
        bots[index] = {
            id: index,
            x: bx,
            y: by,
            angle: bAngle,
            body: bBody,
            color: botColors[index],
            radius: baseRadius,
            changeDirTimer: 0
        };
    }

    // تحويل التعبان الميت لأكل مكثف فوري
    function explodeToFood(bodyPoints) {
        for (let p of bodyPoints) {
            if (Math.random() > 0.3) { // مش كل النقاط عشان الزحمة، بس أغلبها
                foods.push({
                    x: p.x + (Math.random() * 10 - 5),
                    y: p.y + (Math.random() * 10 - 5),
                    color: "#ffeaa7" // أكل دهبي مميز ومغذي جداً!
                });
            }
        }
    }

    // 🕹️ تحكم الـ Joystick الخفي السلس
    let isTouching = false;
    let joyStartX = 0; 
    let joyStartY = 0; 
    const MAX_JOY_RADIUS = 40; 

    window.addEventListener("pointerdown", (e) => {
        isTouching = true;
        joyStartX = e.clientX;
        joyStartY = e.clientY;
    });

    window.addEventListener("pointermove", (e) => {
        if (!isTouching) return;
        let dx = e.clientX - joyStartX;
        let dy = e.clientY - joyStartY;
        let distance = Math.hypot(dx, dy);

        if (distance > 5) {
            snakeAngle = Math.atan2(dy, dx);
            if (distance > MAX_JOY_RADIUS) {
                let angle = Math.atan2(dy, dx);
                joyStartX = e.clientX - Math.cos(angle) * MAX_JOY_RADIUS;
                joyStartY = e.clientY - Math.sin(angle) * MAX_JOY_RADIUS;
            }
        }
    });

    window.addEventListener("pointerup", () => { isTouching = false; });
    window.addEventListener("pointercancel", () => { isTouching = false; });

    function draw() {
        if (isGameOver) return;

        pulseTime += 0.1; 
        ctx.fillStyle = "#0c0c0e";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let centerX = canvas.width / 2;
        let centerY = canvas.height / 2;

        // --- 1. تحديث حركة اللاعب الأصلي ---
        snakeX += Math.cos(snakeAngle) * speed;
        snakeY += Math.sin(snakeAngle) * speed;
        snake.unshift({ x: snakeX, y: snakeY });
        snake.pop(); 

        if (Math.hypot(snakeX, snakeY) > WORLD_RADIUS) {
            isGameOver = true;
            alert("احترق التعبان خارج حدود الكوكب! 🌋 نقاطك: " + score);
            location.reload();
            return;
        }

        // --- 2. تحديث حركة الـ Bots ذكاء اصطناعي ---
        for (let b of bots) {
            b.changeDirTimer++;
            // البوت يغير اتجاهه كل فترة بشكل عشوائي ناعم عشان يدور على الأكل
            if (b.changeDirTimer > 100 + Math.random() * 100) {
                b.angle += (Math.random() * 2 - 1); 
                b.changeDirTimer = 0;
            }

            b.x += Math.cos(b.angle) * (speed * 0.85); // أبطأ سنة من اللاعب عشان العدل
            b.y += Math.sin(b.angle) * (speed * 0.85);
            b.body.unshift({ x: b.x, y: b.y });
            b.body.pop();

            // لو البوت خرج بره الخريطة يرجع تاني
            if (Math.hypot(b.x, b.y) > WORLD_RADIUS) {
                spawnBot(b.id);
            }
        }

        // --- 3. نظام التصادم والموت (Collision System) ---
        // أ) هل رأس اللاعب خبطت في جسم أي بوت؟
        for (let b of bots) {
            // بنبدأ من العنصر رقم 3 في الجسم عشان ما يخبطش في رقبته
            for (let j = 3; j < b.body.length; j++) {
                if (Math.hypot(snakeX - b.body[j].x, snakeY - b.body[j].y) < (currentRadius + b.radius - 2)) {
                    isGameOver = true;
                    alert("🚨 مراتي هتكسبك كدة! خبطت في البوت ومُت! نقاطك: " + score);
                    location.reload();
                    return;
                }
            }
        }

        // ب) هل رأس البوت خبطت في جسم اللاعب؟ (هنا الصيد المتين!)
        for (let b of bots) {
            for (let j = 3; j < snake.length; j++) {
                if (Math.hypot(b.x - snake[j].x, b.y - snake[j].y) < (b.radius + currentRadius - 2)) {
                    explodeToFood(b.body); // البوت يتفجر أكل!
                    spawnBot(b.id); // يولد بوت جديد في مكان تاني
                    score += 15; // مكافأة قتل البوت
                    document.getElementById("score").innerText = score;
                }
            }
        }

        // --- 4. التقاط الأكل (اللاعب + البوتات) ---
        for (let i = foods.length - 1; i >= 0; i--) {
            let f = foods[i];
            
            // اللاعب يأكل
            if (Math.hypot(snakeX - f.x, snakeY - f.y) < (currentRadius + 6)) {
                foods.splice(i, 1); 
                score++;
                document.getElementById("score").innerText = score;
                currentRadius += 0.12; 
                spawnFood(); 
                for (let k = 0; k < 5; k++) {
                    snake.push({ x: snake[snake.length - 1].x, y: snake[snake.length - 1].y });
                }
                continue;
            }

            // البوتات تأكل وتكبر برضه!
            for (let b of bots) {
                if (Math.hypot(b.x - f.x, b.y - f.y) < (b.radius + 6)) {
                    foods.splice(i, 1);
                    b.radius += 0.05; // البوت بيكبر بس أبطأ شوية
                    spawnFood();
                    b.body.push({ x: b.body[b.body.length-1].x, y: b.body[b.body.length-1].y });
                    break;
                }
            }
        }

        // --- 5. الررررررسم على الكانفاس ---
        let offsetX = centerX - snakeX;
        let offsetY = centerY - snakeY;

        ctx.save();
        ctx.translate(offsetX, offsetY); 
        
        // رسم السور الخارجي
        ctx.strokeStyle = "#ff4757";
        ctx.lineWidth = 6;
        ctx.shadowBlur = 10; 
        ctx.shadowColor = "#ff4757";
        ctx.beginPath();
        ctx.arc(0, 0, WORLD_RADIUS, 0, 2 * Math.PI);
        ctx.stroke();
        ctx.shadowBlur = 0; 

        // رسم الشبكة الخلفية
        ctx.strokeStyle = "rgba(255, 69, 0, 0.03)";
        ctx.lineWidth = 1;
        for (let x = -WORLD_RADIUS; x < WORLD_RADIUS; x += 60) {
            ctx.beginPath(); ctx.moveTo(x, -WORLD_RADIUS); ctx.lineTo(x, WORLD_RADIUS); ctx.stroke();
        }
        for (let y = -WORLD_RADIUS; y < WORLD_RADIUS; y += 60) {
            ctx.beginPath(); ctx.moveTo(-WORLD_RADIUS, y); ctx.lineTo(WORLD_RADIUS, y); ctx.stroke();
        }

        // رسم الأكل
        for (let f of foods) {
            ctx.fillStyle = f.color;
            ctx.beginPath();
            ctx.arc(f.x, f.y, 5, 0, 2 * Math.PI);
            ctx.fill();
        }

        // رسم البوتات (الآليين)
        for (let b of bots) {
            for (let i = 0; i < b.body.length; i++) {
                let r = (i === 0) ? b.radius * 1.2 : b.radius;
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.body[i].x, b.body[i].y, r, 0, 2 * Math.PI);
                ctx.fill();

                // عيون البوتات عشان يبانوا باصين فين
                if (i === 0) {
                    ctx.save();
                    ctx.translate(b.body[i].x, b.body[i].y);
                    ctx.rotate(b.angle);
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath(); ctx.arc(r*0.3, -r*0.4, r*0.25, 0, 2*Math.PI); ctx.fill();
                    ctx.beginPath(); ctx.arc(r*0.3, r*0.4, r*0.25, 0, 2*Math.PI); ctx.fill();
                    ctx.restore();
                }
            }
        }

        // رسم تعبان اللاعب الرئيسي (مع تأثير التوهج 10 الرايق)
        for (let i = 0; i < snake.length; i++) {
            let radius = (i === 0) ? currentRadius * 1.2 : currentRadius;
            if (i > snake.length - 4) {
                let tailIndex = snake.length - i;
                radius = currentRadius * (tailIndex / 4);
            }

            let wave = Math.abs(Math.sin(pulseTime + (i * 0.25)));
            let lavaColor = `rgb(255, ${Math.floor(60 + wave * 140)}, 0)`;

            ctx.shadowBlur = 10; 
            ctx.shadowColor = lavaColor;

            ctx.fillStyle = lavaColor;
            ctx.beginPath();
            ctx.arc(snake[i].x, snake[i].y, radius, 0, 2 * Math.PI);
            ctx.fill();

            ctx.shadowBlur = 0;

            ctx.fillStyle = (i === 0) ? "#2d3436" : "rgba(25, 25, 30, 0.85)";
            ctx.beginPath();
            ctx.arc(snake[i].x, snake[i].y, Math.max(1, radius * 0.6), 0, 2 * Math.PI);
            ctx.fill();

            // رسم العيون التفاعلية في رأس اللاعب
            if (i === 0) {
                ctx.save();
                ctx.translate(snake[i].x, snake[i].y);
                ctx.rotate(snakeAngle);

                // العين اليمين
                ctx.fillStyle = "#ffffff";
                ctx.beginPath(); ctx.arc(radius * 0.3, -radius * 0.4, radius * 0.25, 0, 2 * Math.PI); ctx.fill();
                ctx.fillStyle = "#000000";
                ctx.beginPath(); ctx.arc(radius * 0.38, -radius * 0.4, radius * 0.12, 0, 2 * Math.PI); ctx.fill();

                // العين الشمال
                ctx.fillStyle = "#ffffff";
                ctx.beginPath(); ctx.arc(radius * 0.3, radius * 0.4, radius * 0.25, 0, 2 * Math.PI); ctx.fill();
                ctx.fillStyle = "#000000";
                ctx.beginPath(); ctx.arc(radius * 0.38, radius * 0.4, radius * 0.12, 0, 2 * Math.PI); ctx.fill();

                ctx.restore();
            }
        }

        ctx.restore(); 
        requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
</script>

</body>
</html>
